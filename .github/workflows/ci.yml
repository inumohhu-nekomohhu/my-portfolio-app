name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------
  # フロントエンド: Vitest（単体テスト）
  # -----------------------------------------------
  frontend-test:
    name: Frontend Unit Test (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: 依存パッケージインストール
        run: npm ci

      - name: ESLint実行
        run: npm run lint

      - name: Vitestテスト実行
        run: npm run test

  # -----------------------------------------------
  # フロントエンド: Playwright（E2E・UIテスト）
  # ※ APIサーバーが必要なテストはスキップ（認証ガードのみ実行）
  # -----------------------------------------------
  frontend-e2e:
    name: Frontend E2E Test (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: 依存パッケージインストール
        run: npm ci

      - name: Playwrightブラウザインストール
        run: npx playwright install --with-deps chromium

      - name: Vite開発サーバー起動（バックグラウンド）
        run: npm run dev &
        env:
          VITE_API_URL: http://localhost:3000

      - name: サーバー起動待機
        run: npx wait-on http://localhost:5173 --timeout 30000

      - name: Playwright E2Eテスト実行（認証ガードのみ）
        run: npx playwright test e2e/auth.spec.ts --grep "認証ガード" --reporter=list
        continue-on-error: true

      - name: テストレポートのアップロード
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 7

  # -----------------------------------------------
  # バックエンド: RSpec
  # -----------------------------------------------
  backend-test:
    name: Backend Test (RSpec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: pass
          MYSQL_DATABASE: project_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      MYSQL_USER: root
      MYSQL_PASSWORD: pass
      MYSQL_DATABASE: project_test
      DATABASE_URL: mysql2://root:pass@127.0.0.1:3306/project_test

    steps:
      - uses: actions/checkout@v4

      - name: Rubyセットアップ
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: api

      - name: DBセットアップ
        run: |
          bundle exec rails db:create
          bundle exec rails db:migrate

      - name: RSpec実行
        run: bundle exec rspec --format progress