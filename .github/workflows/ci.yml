name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------
  # フロントエンド: Vitest
  # -----------------------------------------------
  frontend-test:
    name: Frontend Test (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: 依存パッケージインストール
        run: npm ci

      - name: ESLint実行
        run: npm run lint

      - name: Vitestテスト実行
        run: npm run test

  # -----------------------------------------------
  # バックエンド: RSpec
  # -----------------------------------------------
  backend-test:
    name: Backend Test (RSpec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: pass
          MYSQL_DATABASE: project_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      MYSQL_USER: root
      MYSQL_PASSWORD: pass
      MYSQL_DATABASE: project_test
      DATABASE_URL: mysql2://root:pass@127.0.0.1:3306/project_test

    steps:
      - uses: actions/checkout@v4

      - name: Rubyセットアップ
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: api

      - name: DBセットアップ
        run: |
          bundle exec rails db:create
          bundle exec rails db:migrate

      - name: RSpec実行
        run: bundle exec rspec --format progress